<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مروحة RGB المحمولة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        
        /* Container */
        .container {
            max-width: 72rem;
            margin: 0 auto;
            padding: 1rem 0.75rem 5rem;
        }
        /* Make default blue color have purple ring */

        
        @media (min-width: 640px) {
            .container {
                padding: 1.5rem 1rem 7rem;
            }
        }
        
        @media (min-width: 768px) {
            .container {
                padding: 3rem 1.5rem 7rem;
            }
        }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .grid {
                gap: 1.5rem;
            }
        }
        
        @media (min-width: 768px) {
            .grid {
                gap: 2rem;
            }
        }
        
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
            }
        }
        
        /* Images Section */
        .images-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        @media (min-width: 640px) {
            .images-section {
                gap: 1rem;
            }
        }
        
        .image-container {
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
            max-height: 70vh;
            min-height: 200px;
        }
        
        .image-container.tall {
            min-height: 350px;
            max-height: 80vh;
        }
        
        @media (max-width: 640px) {
            .image-container {
                min-height: 180px;
                max-height: 50vh;
            }
            .image-container.tall {
                min-height: 250px;
                max-height: 60vh;
            }
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Content Card */
        .content-card {
            background-color: #ffffff;
            padding: 1rem;
            border-radius: 1.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .content-card {
                padding: 1.5rem;
                border-radius: 2rem;
                gap: 1.5rem;
            }
        }
        
        /* Header */
        .header-card {
            border-radius: 1rem;
            background: linear-gradient(to right, #c026d3, #7c3aed);
            color: white;
            padding: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        @media (min-width: 640px) {
            .header-card {
                border-radius: 1.5rem;
                padding: 1.5rem;
            }
        }
        
        .header-card h1 {
            font-size: 1.25rem;
            font-weight: 900;
            line-height: 1.25;
            margin-top: 0;
        }
        
        @media (min-width: 640px) {
            .header-card h1 {
                font-size: 1.5rem;
            }
        }
        
        @media (min-width: 768px) {
            .header-card h1 {
                font-size: 1.875rem;
            }
        }
        
        @media (min-width: 1024px) {
            .header-card h1 {
                font-size: 2.25rem;
            }
        }
        
        .header-card p {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            opacity: 0.9;
            line-height: 1.625;
        }
        
        @media (min-width: 640px) {
            .header-card p {
                margin-top: 0.75rem;
                font-size: 0.875rem;
            }
        }
        
        @media (min-width: 768px) {
            .header-card p {
                font-size: 1rem;
            }
        }
        
        /* Price */
        .price-section {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .price-old {
            color: #9ca3af;
            text-decoration: line-through;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        @media (min-width: 640px) {
            .price-old {
                font-size: 1rem;
            }
        }
        
        .price-current {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7c3aed;
        }
        
        @media (min-width: 640px) {
            .price-current {
                font-size: 1.875rem;
            }
        }
        
        @media (min-width: 768px) {
            .price-current {
                font-size: 2.25rem;
            }
        }
        
        /* Offer Cards */
        .offer-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        
        .offer-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .offer-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
            background-color: transparent;
            box-shadow: none;
        }
        
        @media (min-width: 640px) {
            .offer-card {
                padding: 0.875rem;
            }
        }
        
        .offer-card.selected {
            border-color: #d946ef !important;
            background-color: rgba(248, 113, 255, 0.12) !important;
            box-shadow: inset 0 0 0 1px rgba(220, 38, 255, 0.18) !important;
        }
        
        .offer-card input[type="radio"] {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            accent-color: #d946ef;
            width: 1rem;
            height: 1rem;
        }
        
        @media (min-width: 640px) {
            .offer-card input[type="radio"] {
                left: 1rem;
                width: 1.125rem;
                height: 1.125rem;
            }
        }
        
        .offer-info {
            padding-right: 0.25rem;
        }
        
        .offer-title {
            display: block;
            font-weight: 700;
            color: #111827;
            font-size: 0.75rem;
        }
        
        @media (min-width: 640px) {
            .offer-title {
                font-size: 0.875rem;
            }
        }
        
        .offer-desc {
            font-size: 0.625rem;
            color: #6b7280;
        }
        
        @media (min-width: 640px) {
            .offer-desc {
                font-size: 0.6875rem;
            }
        }
        
        .offer-price {
            font-weight: 900;
            font-size: 0.875rem;
            margin-left: 1.5rem;
        }
        
        @media (min-width: 640px) {
            .offer-price {
                font-size: 1rem;
                margin-left: 2rem;
            }
        }
        
        .offer-price.violet {
            color: #7c3aed;
        }
        
        .offer-price.gray {
            color: #111827;
        }
        
        /* Form */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #374151;
        }
        
        .form-input,
        .form-select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            background-color: #ffffff;
            transition: all 0.2s;
        }
        
        .form-input:focus,
        .form-select:focus {
            outline: none;
            ring: 2px solid #14b8a6;
        }
        
        .form-input.text-left {
            text-align: left;
            direction: ltr;
        }
        
        /* Color Selection */
        .color-group {
            display: flex;
            gap: 0.75rem;
            background-color: #f9fafb;
            padding: 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }
        
        @media (min-width: 640px) {
            .color-group {
                gap: 1.25rem;
                padding: 0.75rem;
            }
        }
        
        .color-label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            user-select: none;
        }
        
        @media (min-width: 640px) {
            .color-label {
                gap: 0.5rem;
            }
        }
        
        .color-label input[type="radio"] {
            display: none;
        }
        
        .color-circle {
            display: block;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 9999px;
            border: 2px solid white;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            ring: 1px solid #d1d5db;
            transition: all 0.15s;
        }
        
        @media (min-width: 640px) {
            .color-circle {
                width: 1.5rem;
                height: 1.5rem;
            }
        }
        
        .color-label input[type="radio"]:checked + .color-circle {
            ring: 4px solid #d946ef;
        }
        
        .color-name {
            font-size: 0.625rem;
            font-weight: 700;
            color: #374151;
        }
        
        @media (min-width: 640px) {
            .color-name {
                font-size: 0.75rem;
            }
        }
        
        .color-label.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .color-label.disabled .color-circle {
            ring: 1px solid #d1d5db;
        }
        
        .color-label.disabled .color-name {
            color: #6b7280;
        }
        
        .color-label.disabled i {
            color: #ec4899;
            font-size: 0.5rem;
        }
        
        @media (min-width: 640px) {
            .color-label.disabled i {
                font-size: 0.75rem;
            }
        }
        
        /* Delivery Options */
        .delivery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        
        .delivery-option {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .delivery-option input[type="radio"] {
            display: none;
        }
        
        .delivery-box {
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            text-align: center;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        
        .delivery-option input[type="radio"]:checked + .delivery-box {
            border-color: #d946ef !important;
            background-color: rgba(248, 113, 255, 0.08) !important;
        }
        
        .delivery-box i {
            font-size: 1rem;
            color: #d946ef;
        }
        
        .delivery-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #374151;
        }
        
        .delivery-price {
            font-size: 0.65rem;
            color: #6b7280;
        }
        
        /* Price Summary */
        .summary-card {
            background-color: #f9fafb;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }
        
        .summary-row .label {
            color: #6b7280;
        }
        
        .summary-row .value {
            font-weight: 700;
            color: #1f2937;
        }
        
        .summary-divider {
            border-top: 1px solid #e5e7eb;
            padding-top: 0.5rem;
            margin-top: 0.25rem;
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }
        
        .summary-total .label {
            font-weight: 700;
            color: #374151;
        }
        
        .summary-total .value {
            font-weight: 900;
            color: #7c3aed;
            font-size: 1.25rem;
        }
        
        /* Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(to right, #7c3aed, #6d28d9);
            color: white;
            font-weight: 700;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
        }
        
        @media (min-width: 640px) {
            .submit-btn {
                font-size: 0.875rem;
            }
        }
        
        .submit-btn:hover {
            background: linear-gradient(to right, #6d28d9, #5b21b6);
        }
        
        .submit-btn:active {
            transform: scale(0.99);
        }
        
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        /* Utilities */
        .space-y-1 { display: flex; flex-direction: column; gap: 0.25rem; }
        .space-y-2 { display: flex; flex-direction: column; gap: 0.5rem; }
        .space-y-3 { display: flex; flex-direction: column; gap: 0.75rem; }
        .space-y-4 { display: flex; flex-direction: column; gap: 1rem; }
        .mt-0 { margin-top: 0; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .w-full { width: 100%; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .text-center { text-align: center; }
        .bg-white { background-color: #ffffff; }
        .bg-gray-50 { background-color: #f9fafb; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-700 { color: #374151; }
        .text-gray-800 { color: #1f2937; }
        .text-violet-600 { color: #7c3aed; }
        .text-violet-700 { color: #6d28d9; }
        .text-fuchsia-600 { color: #d946ef; }
        .text-white { color: #ffffff; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .border { border: 1px solid #e5e7eb; }
        .border-gray-100 { border-color: #f3f4f6; }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-gray-300 { border-color: #d1d5db; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .overflow-hidden { overflow: hidden; }
        .cursor-pointer { cursor: pointer; }
        .cursor-not-allowed { cursor: not-allowed; }
        .select-none { user-select: none; }
        .transition-all { transition: all 0.15s; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .object-contain { object-fit: contain; }
        .antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .min-h-screen { min-height: 100vh; }
        
        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

    <div class="container">
        <div class="grid">
            
            <!-- Images Section -->
            <div class="images-section">
                <div class="image-container tall">
                    <img src="img1.jpg" alt="Product image 1" />
                </div>
                <div class="image-container">
                    <img src="rgb_2.jpg" alt="Product image 2" />
                </div>
                <div class="image-container">
                    <img src="img2.jpg" alt="Product image 3" />
                </div>
            </div>

            <!-- Content Section -->
            <div class="content-card">
                
                <!-- Header -->
                <div class="header-card">
                    <h1>مروحة RGB المحمولة</h1>
                    <p>مروحة محمولة بقوة 3 سرعات مع إضاءة RGB، خفيفة وسهلة الحمل</p>
                </div>
                
                <!-- Price -->
                <div class="price-section">
                    <span class="price-old">3600 د.ج</span>
                    <span class="price-current">2000 د.ج</span>
                </div>

                <!-- Offer Selection -->
                <div>
                    <label class="offer-label">اختر العرض المناسب لك:</label>
                    <div class="offer-list">
                        <label id="containerOffer1" class="offer-card selected">
                            <input type="radio" name="product_offer" value="1" checked onchange="switchOffer(2000, 1)">
                            <div class="offer-info">
                                <span class="offer-title">عرض قطعة واحدة</span>
                                <span class="offer-desc">مروحة واحدة ملونة بقوة كاملة</span>
                            </div>
                            <span class="offer-price violet">2000 د.ج</span>
                        </label>
                        
                        <label id="containerOffer2" class="offer-card">
                            <input type="radio" name="product_offer" value="2" onchange="switchOffer(3800, 2)">
                            <div class="offer-info">
                                <span class="offer-title">عرض قطعتين (2)</span>
                                <span class="offer-desc">احصل على جهازين بسعر مخفض وشحن موحد</span>
                            </div>
                            <span class="offer-price gray">3800 د.ج</span>
                        </label>
                    </div>
                </div>

                <!-- Form -->
                <form id="orderForm" class="space-y-3" onsubmit="event.preventDefault();">
                    
                    <!-- Color Selection -->
<div class="form-group">
    <label class="form-label">اختر لون المروحة المفضّل *</label>
    <div class="color-group">
        <label class="color-label default-checked">
            <input type="radio" name="product_color" value="أزرق" checked>
            <span class="color-circle" style="background-color: #2563eb;"></span>
            <span class="color-name">أزرق</span>
        </label>
        
        <label class="color-label">
            <input type="radio" name="product_color" value="أخضر">
            <span class="color-circle" style="background-color: #10b981;"></span>
            <span class="color-name">أخضر</span>
        </label>
        
        <label class="color-label disabled">
            <input type="radio" name="product_color" value="وردي" disabled>
            <span class="color-circle" style="background-color: #ec4899;"></span>
            <i class="fa-solid fa-ban"></i>
            <span class="color-name">نفاذ الكمية</span>
        </label>
    </div>
</div>

                    <!-- Input Fields -->
                    <div class="form-group">
                        <label class="form-label">الاسم واللقب *</label>
                        <input type="text" id="customer_name" required class="form-input" placeholder="مثال: محمد السعيد">
                    </div>

                    <div class="form-group">
                        <label class="form-label">رقم الهاتف * (10 أرقام تبدأ بـ 0)</label>
                        <input type="tel" id="phone_number" required class="form-input text-left" dir="ltr" placeholder="0XXXXXXXXX">
                    </div>

                    <div class="form-group">
                        <label class="form-label">الولاية *</label>
                        <select id="wilayaSelect" required onchange="calculateTotal()" class="form-select">
                            <option value="">-- اختر الولاية من القائمة --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">العنوان بالتفصيل</label>
                        <input type="text" id="address" class="form-input" placeholder="البلدية، الحي، رقم الشارع">
                    </div>

                    <!-- Delivery Type Selection -->
                    <div class="form-group">
                        <label class="form-label">طريقة التوصيل *</label>
                        <div class="delivery-grid">
                            <label class="delivery-option">
                                <input type="radio" name="livraison_post" value="domicile" checked onchange="calculateTotal()">
                                <div class="delivery-box">
                                    <i class="fas fa-truck"></i>
                                    <span class="delivery-label">توصيل للمنزل</span>
                                    <span class="delivery-price" id="domicilePrice">-</span>
                                </div>
                            </label>
                            
                            <label class="delivery-option">
                                <input type="radio" name="livraison_post" value="bureau" onchange="calculateTotal()">
                                <div class="delivery-box">
                                    <i class="fas fa-envelope"></i>
                                    <span class="delivery-label">توصيل للبريد</span>
                                    <span class="delivery-price" id="postPrice">-</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Price Summary -->
                    <div class="summary-card">
                        <div class="summary-row">
                            <span class="label">سعر المنتج:</span>
                            <span class="value" id="displayProductPrice">2000 د.ج</span>
                        </div>
                        <div class="summary-row">
                            <span class="label">سعر التوصيل:</span>
                            <span class="value" id="displayDeliveryPrice">-</span>
                        </div>
                        <div class="summary-divider">
                            <div class="summary-total">
                                <span class="label">المجموع الكلي:</span>
                                <span class="value" id="displayTotalPrice">2000 د.ج</span>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Submit Button -->
                <div>
                    <button onclick="submitOrder()" id="submitBtn" class="submit-btn">
                        <i class="fa-solid fa-basket-shopping"></i>
                        تأكيد الطلب - الدفع عند الاستلام
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukmpamuyakbeewbbkhxc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-mFgnkFPzb2iBNqZXmAHcA_Qpvp1S38';
        
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        let selectedProductPrice = 2000;
        let selectedQuantity = 1;
        let loadedWilayas = [];
        let currentDeliveryPrice = 0;
        let currentWilayaData = null;
        let wilayaSelected = false;

        document.addEventListener('DOMContentLoaded', function() {
            fetchWilayasFromSupabase();
        });

        async function fetchWilayasFromSupabase() {
            const selectElement = document.getElementById('wilayaSelect');
            if (!supabaseClient || SUPABASE_URL === "YOUR_SUPABASE_URL") {
                selectElement.innerHTML = `<option value="">-- خطأ: لم يتم ربط مفاتيح سوبابيس --</option>`;
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('wilayas_store')
                    .select('id, number, name, delivery_domicile, delivery_post')
                    .order('number', { ascending: true });

                if (error) throw error;
                loadedWilayas = data;
                
                selectElement.innerHTML = `<option value="">-- اختر الولاية من القائمة --</option>`;
                loadedWilayas.forEach(function(wilaya) {
                    const option = document.createElement('option');
                    option.value = wilaya.id;
                    option.textContent = wilaya.number + ' - ' + wilaya.name;
                    selectElement.appendChild(option);
                });
            } catch (err) {
                selectElement.innerHTML = `<option value="">-- فشل جلب الولايات --</option>`;
            }
            calculateTotal();
        }

        function switchOffer(price, qty) {
            selectedProductPrice = price;
            selectedQuantity = qty;
            
            var offer1 = document.getElementById('containerOffer1');
            var offer2 = document.getElementById('containerOffer2');
            
            offer1.classList.remove('selected');
            offer2.classList.remove('selected');
            
            if (qty === 1) {
                offer1.classList.add('selected');
            } else if (qty === 2) {
                offer2.classList.add('selected');
            }
            
            calculateTotal();
        }

        function calculateTotal() {
            var selectedWilayaId = document.getElementById('wilayaSelect').value;
            var deliveryType = document.querySelector('input[name="livraison_post"]:checked')?.value || 'domicile';
            
            wilayaSelected = selectedWilayaId && selectedWilayaId !== '';
            
            if (wilayaSelected && loadedWilayas.length > 0) {
                currentWilayaData = loadedWilayas.find(function(w) { return w.id == selectedWilayaId; });
            } else {
                currentWilayaData = null;
            }
            
            var deliveryPrice = 0;
            var deliveryDisplay = '-';
            
            if (currentWilayaData) {
                deliveryPrice = deliveryType === 'domicile' 
                    ? currentWilayaData.delivery_domicile 
                    : currentWilayaData.delivery_post;
                deliveryDisplay = deliveryPrice + ' د.ج';
            }
            currentDeliveryPrice = deliveryPrice;
            
            var total = wilayaSelected ? selectedProductPrice + deliveryPrice : selectedProductPrice;
            
            document.getElementById('displayProductPrice').textContent = selectedProductPrice + ' د.ج';
            document.getElementById('displayDeliveryPrice').textContent = deliveryDisplay;
            document.getElementById('displayTotalPrice').textContent = wilayaSelected ? total + ' د.ج' : selectedProductPrice + ' د.ج';
            
            if (currentWilayaData) {
                document.getElementById('domicilePrice').textContent = currentWilayaData.delivery_domicile + ' د.ج';
                document.getElementById('postPrice').textContent = currentWilayaData.delivery_post + ' د.ج';
            } else {
                document.getElementById('domicilePrice').textContent = '-';
                document.getElementById('postPrice').textContent = '-';
            }
        }

        async function submitOrder() {
            var customerName = document.getElementById('customer_name').value.trim();
            var phoneNumber = document.getElementById('phone_number').value.trim();
            var wilayaId = document.getElementById('wilayaSelect').value;
            var detailedAddress = document.getElementById('address').value.trim();
            var deliveryType = document.querySelector('input[name="livraison_post"]:checked')?.value || 'domicile';
            
            var selectedColor = document.querySelector('input[name="product_color"]:checked').value;
            
            if (!customerName || !phoneNumber || !wilayaId) {
                alert('من فضلك، املأ جميع الحقول الأساسية المطلوبة والمؤشر عليها بنجمة (*)');
                return;
            }

            if (!detailedAddress) {
                alert('من فضلك، أدخل العنوان بالتفصيل');
                return;
            }

            var strictPhoneCheck = /^0\d{9}$/;
            if (!strictPhoneCheck.test(phoneNumber)) {
                alert('خطأ في رقم الهاتف! يجب أن يتكون من 10 أرقام تماماً ويبدأ بـ 0');
                return;
            }

            var totalPrice = selectedProductPrice + currentDeliveryPrice;

            var submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> جاري إرسال طلبك...';

            var finalOrderPayload = {
                customer_name: customerName,
                phone_number: phoneNumber,
                address: detailedAddress,
                quantity: parseInt(selectedQuantity),
                total_price: parseFloat(totalPrice),
                wilaya_id: parseInt(wilayaId),
                color: selectedColor,
                livraison_post: deliveryType,
                status: 'pending'
            };

            if (!supabaseClient || SUPABASE_URL === "YOUR_SUPABASE_URL") {
                alert("تم الفحص! يرجى وضع مفاتيح سوبابيس الحقيقية في الأسطر الأولى للـ Script لترحيل الطلب.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-basket-shopping"></i> تأكيد الطلب - الدفع عند الاستلام';
                return;
            }

            try {
                var { data, error } = await supabaseClient
                    .from('orders')
                    .insert([finalOrderPayload]);

                if (error) throw error;

                alert('تم تسجيل طلبك ولونك المفضّل بنجاح! سنتصل بك قريباً للتأكيد.');
                document.getElementById('orderForm').reset();
                document.querySelector('input[name="livraison_post"][value="domicile"]').checked = true;
                document.getElementById('wilayaSelect').value = '';
                calculateTotal();
            } catch (err) {
                alert('حدث خطأ أثناء إرسال الطلب: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-basket-shopping"></i> تأكيد الطلب - الدفع عند الاستلام';
            }
        }
    </script>
</body>
</html>

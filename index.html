<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مروحة RGB المحمولة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* Fix for mobile content being cut off */
        .product-image-container {
            max-height: 70vh;
            min-height: 200px;
        }
        @media (max-width: 640px) {
            .product-image-container {
                min-height: 180px;
                max-height: 50vh;
            }
            .mobile-text-sm {
                font-size: 0.75rem !important;
            }
            .mobile-padding {
                padding: 0.75rem !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 md:py-12 pb-20 sm:pb-28">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 md:gap-8 items-start">
            
            <!-- Images Section - Responsive -->
            <div class="space-y-3 sm:space-y-4">
                <div class="w-full overflow-hidden bg-gray-100 product-image-container"style="min-height: 350px; max-height: 80vh;">
                    <img src="img1.jpg" alt="Product image 1" class="w-full h-full object-contain" />
                </div>
                <div class="w-full overflow-hidden bg-gray-100 product-image-container">
                    <img src="rgb_2.jpg" alt="Product image 2" class="w-full h-full object-contain" />
                </div>
                <div class="w-full overflow-hidden bg-gray-100 product-image-container">
                    <img src="img2.jpg" alt="Product image 3" class="w-full h-full object-contain" />
                </div>
            </div>

            <!-- Content Section - Responsive -->
            <div class="bg-white p-4 sm:p-6 rounded-[1.5rem] sm:rounded-[2rem] shadow-sm border border-gray-100 space-y-4 sm:space-y-6">
                
                <div class="space-y-4 sm:space-y-5">
                    <!-- Header Card -->
                    <div class="rounded-2xl sm:rounded-3xl bg-gradient-to-r from-fuchsia-600 to-violet-600 text-white p-4 sm:p-6 shadow-lg">
                        <div class="text-xs sm:text-sm md:text-base lg:text-lg italic font-semibold tracking-wide">
                            توصيل مجاني الآن - Livraison gratuite
                        </div>
                        <h1 class="mt-3 sm:mt-4 text-xl sm:text-2xl md:text-3xl lg:text-4xl font-black leading-tight">
                            مروحة RGB المحمولة
                        </h1>
                        <p class="mt-2 sm:mt-3 text-xs sm:text-sm md:text-base text-white/90 leading-relaxed">
                            توصيل مجاني سريع وآمن حتى باب منزلك. اطلب الآن واستمتع بعرض خاص لا يُفوّت.
                        </p>
                    </div>
                    
                    <!-- Price -->
                    <div class="space-y-1">
                        <div class="text-gray-400 line-through text-sm sm:text-base font-semibold">3600 د.ج</div>
                        <div class="text-2xl sm:text-3xl md:text-4xl font-black text-violet-600">2720 د.ج</div>
                    </div>
                </div>

                <!-- Offer Selection -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">اختر العرض المناسب لك:</label>
                    <div class="space-y-2">
                        <label id="containerOffer1" class="relative flex items-center justify-between p-3 sm:p-3.5 border-2 border-fuchsia-500 bg-fuchsia-50/40 rounded-xl cursor-pointer transition-all select-none">
                            <input type="radio" name="product_offer" value="1" checked onchange="switchOffer(2720, 1)" class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 accent-fuchsia-600 w-4 h-4 sm:w-4.5 sm:h-4.5">
                            <div class="pr-1">
                                <span class="block font-bold text-gray-900 text-xs sm:text-sm">عرض قطعة واحدة</span>
                                <span class="text-[10px] sm:text-[11px] text-gray-500">مروحة واحدة ملونة بقوة كاملة</span>
                            </div>
                            <span class="font-black text-violet-700 text-sm sm:text-base ml-6 sm:ml-8">2720 د.ج</span>
                        </label>
                        
                        <label id="containerOffer2" class="relative flex items-center justify-between p-3 sm:p-3.5 border border-gray-200 rounded-xl cursor-pointer hover:border-fuchsia-300 transition-all select-none">
                            <input type="radio" name="product_offer" value="2" onchange="switchOffer(5100, 2)" class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 accent-fuchsia-600 w-4 h-4 sm:w-4.5 sm:h-4.5">
                            <div class="pr-1">
                                <span class="block font-bold text-gray-900 text-xs sm:text-sm">عرض قطعتين (2)</span>
                                <span class="text-[10px] sm:text-[11px] text-gray-500">احصل على جهازين بسعر مخفض وشحن موحد</span>
                            </div>
                            <span class="font-black text-gray-900 text-sm sm:text-base ml-6 sm:ml-8">5200 د.ج</span>
                        </label>
                    </div>
                </div>

                <!-- Form -->
                <form id="orderForm" class="space-y-3 sm:space-y-4" onsubmit="event.preventDefault();">
                    
                    <!-- Color Selection -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-2">اختر لون المروحة المفضّل *</label>
                        <div class="flex gap-3 sm:gap-5 bg-gray-50 p-2 sm:p-3 rounded-xl border border-gray-200 flex-wrap">
                            <label class="flex items-center gap-1 sm:gap-2 cursor-pointer select-none">
                                <input type="radio" name="product_color" value="أزرق" checked class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-600 block border-2 border-white shadow-sm ring-1 ring-gray-300 peer-checked:ring-4 peer-checked:ring-fuchsia-500 transition-all"></span>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-700">أزرق</span>
                            </label>
                            
                            <label class="flex items-center gap-1 sm:gap-2 cursor-pointer select-none">
                                <input type="radio" name="product_color" value="أخضر" class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-emerald-500 block border-2 border-white shadow-sm ring-1 ring-gray-300 peer-checked:ring-4 peer-checked:ring-fuchsia-500 transition-all"></span>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-700">أخضر</span>
                            </label>
                            
                            <label class="flex items-center gap-1 sm:gap-2 select-none opacity-60 cursor-not-allowed">
                                <input type="radio" name="product_color" value="وردي" disabled class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-pink-500 block border-2 border-white ring-1 ring-gray-300"></span>
                                <i class="fa-solid fa-ban text-pink-500 text-[8px] sm:text-xs"></i>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-500">نفاذ الكمية</span>
                            </label>
                        </div>
                    </div>

                    <!-- Input Fields -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الاسم واللقب *</label>
                        <input type="text" id="customer_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="مثال: محمد السعيد">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">رقم الهاتف * (10 أرقام تبدأ بـ 0)</label>
                        <input type="tel" id="phone_number" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 text-left bg-white" dir="ltr" placeholder="0XXXXXXXXX">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الولاية *</label>
                        <select id="wilayaSelect" required onchange="calculateShipping()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                            <option value="">-- اختر الولاية من القائمة --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">العنوان بالتفصيل</label>
                        <input type="text" id="address" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="البلدية، الحي، رقم الشارع">
                    </div>
                </form>

                <!-- Footer -->
                <div class="flex flex-col gap-3 sm:gap-4 md:flex-row md:items-center md:justify-between">
                    <div class="text-sm text-gray-500">
                        <span class="block uppercase tracking-[0.2em] font-black text-xs sm:text-sm">المجموع الكلي</span>
                        <span id="footerTotal" class="text-2xl sm:text-3xl font-black text-violet-700">2720 د.ج</span>
                    </div>
                    <button onclick="submitOrder()" id="submitBtn" class="w-full md:max-w-md bg-gradient-to-r from-purple-600 to-violet-700 hover:from-purple-700 hover:to-violet-800 text-white font-bold py-3 px-5 rounded-xl shadow active:scale-[0.99] transition-all text-center flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-basket-shopping"></i>
                        تأكيد الطلب - الدفع عند الاستلام
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Your existing JavaScript remains the same -->
    <script>
        // ... (keep your existing JavaScript code unchanged)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مروحة RGB المحمولة</title>
    
    <!-- Tailwind CSS (Restored to keep your exact design intact) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Preconnect for Supabase -->
    <link rel="preconnect" href="https://ukmpamuyakbeewbbkhxc.supabase.co" crossorigin>

    <style>
        /* System fonts instead of Google Fonts for zero-delay loading */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .product-image-container {
            max-height: 70vh;
            min-height: 200px;
        }
        
        @media (max-width: 640px) {
            .product-image-container {
                min-height: 180px;
                max-height: 50vh;
            }
        }

        .offer-card {
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
            border-color: #e5e7eb;
            background-color: transparent;
            box-shadow: none;
        }

        .offer-card.selected {
            border-color: #d946ef !important;
            background-color: rgba(248, 113, 255, 0.12) !important;
            box-shadow: inset 0 0 0 1px rgba(220, 38, 255, 0.18) !important;
        }

        .delivery-option {
            transition: all 0.2s ease;
        }

        .delivery-option input[type="radio"]:checked + .delivery-box {
            border-color: #d946ef !important;
            background-color: rgba(248, 113, 255, 0.08) !important;
        }

        .delivery-box {
            border: 2px solid #e5e7eb;
            transition: all 0.2s ease;
            padding: 0.5rem 0.75rem;
        }
    </style>

    <!-- Supabase loaded efficiently -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 md:py-12 pb-20 sm:pb-28">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 md:gap-8 items-start">
            
            <!-- Images Section -->
            <div class="space-y-3 sm:space-y-4">
                <div class="w-full overflow-hidden ">
    <img src="img1.jpg" alt="Product image 1" class="w-full h-auto" fetchpriority="high" />
</div>

                <!-- <div class="w-full overflow-hidden bg-gray-100 product-image-container">
                    <img src="rgb_2.jpg" alt="Product image 2" class="w-full h-full object-contain" loading="lazy" />
                </div> -->
                <div class="w-full overflow-hidden bg-gray-100 product-image-container">
                    <img src="img2.jpg" alt="Product image 3" class="w-full h-full object-contain" loading="lazy" />
                </div>
            </div>

            <!-- Content Section -->
            <div class="bg-white p-4 sm:p-6 rounded-[1.5rem] sm:rounded-[2rem] shadow-sm border border-gray-100 space-y-4 sm:space-y-6">
                
                <div class="space-y-4 sm:space-y-5">
                    <!-- Header Card -->
                    <div class="rounded-2xl sm:rounded-3xl bg-gradient-to-r from-fuchsia-600 to-violet-600 text-white p-4 sm:p-6 shadow-lg">
                        <h1 class="mt-0 text-xl sm:text-2xl md:text-3xl lg:text-4xl font-black leading-tight">
                            مروحة RGB المحمولة
                        </h1>
                        <p class="mt-2 sm:mt-3 text-xs sm:text-sm md:text-base text-white/90 leading-relaxed">
                            مروحة محمولة بقوة 3 سرعات مع إضاءة RGB، خفيفة وسهلة الحمل
                        </p>
                    </div>
                    
                    <!-- Price -->
                    <div class="space-y-1">
                        <div class="text-gray-400 line-through text-sm sm:text-base font-semibold">3600 د.ج</div>
                        <div class="text-2xl sm:text-3xl md:text-4xl font-black text-violet-600">1600 د.ج</div>
                    </div>
                </div>

                <!-- Offer Selection -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">اختر العرض المناسب لك:</label>
                    <div class="space-y-2">
                        <label id="containerOffer1" class="relative flex items-center justify-between p-3 sm:p-3.5 border-2 rounded-xl cursor-pointer transition-all select-none offer-card selected">
                            <input type="radio" name="product_offer" value="1" checked onchange="switchOffer(1600, 1)" class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 accent-fuchsia-600 w-4 h-4 sm:w-4.5 sm:h-4.5">
                            <div class="pr-1">
                                <span class="block font-bold text-gray-900 text-xs sm:text-sm">عرض قطعة واحدة</span>
                                <span class="text-[10px] sm:text-[11px] text-gray-500">مروحة واحدة ملونة بقوة كاملة</span>
                            </div>
                            <span class="font-black text-violet-700 text-sm sm:text-base ml-6 sm:ml-8">1600 د.ج</span>
                        </label>
                        
                        <label id="containerOffer2" class="relative flex items-center justify-between p-3 sm:p-3.5 border-2 rounded-xl cursor-pointer transition-all select-none offer-card">
                            <input type="radio" name="product_offer" value="2" onchange="switchOffer(3000, 2)" class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 accent-fuchsia-600 w-4 h-4 sm:w-4.5 sm:h-4.5">
                            <div class="pr-1">
                                <span class="block font-bold text-gray-900 text-xs sm:text-sm">عرض قطعتين (2)</span>
                                <span class="text-[10px] sm:text-[11px] text-gray-500">احصل على جهازين بسعر مخفض وشحن موحد</span>
                            </div>
                            <span class="font-black text-gray-900 text-sm sm:text-base ml-6 sm:ml-8">3000 د.ج</span>
                        </label>
                    </div>
                </div>

                <!-- Form -->
                <form id="orderForm" class="space-y-3 sm:space-y-4" onsubmit="event.preventDefault();">
                    
                    <!-- Color Selection -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-2">اختر لون المروحة المفضّل *</label>
                        <div class="flex gap-3 sm:gap-5 bg-gray-50 p-2 sm:p-3 rounded-xl border border-gray-200 flex-wrap">
                            <label class="flex items-center gap-1 sm:gap-2 cursor-pointer select-none">
                                <input type="radio" name="product_color" value="أزرق" checked class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-600 block border-2 border-white shadow-sm ring-1 ring-gray-300 peer-checked:ring-4 peer-checked:ring-fuchsia-500 transition-all"></span>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-700">أزرق</span>
                            </label>
                            
                            <label class="flex items-center gap-1 sm:gap-2 cursor-pointer select-none">
                                <input type="radio" name="product_color" value="أخضر" class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-emerald-500 block border-2 border-white shadow-sm ring-1 ring-gray-300 peer-checked:ring-4 peer-checked:ring-fuchsia-500 transition-all"></span>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-700">أخضر</span>
                            </label>
                            
                            <label class="flex items-center gap-1 sm:gap-2 select-none opacity-60 cursor-not-allowed">
                                <input type="radio" name="product_color" value="وردي" disabled class="sr-only peer">
                                <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-pink-500 block border-2 border-white ring-1 ring-gray-300 relative flex items-center justify-center">
                                    <!-- Ban SVG -->
                                    <svg class="w-3 h-3 text-white absolute" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg>
                                </span>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-500">نفاذ الكمية</span>
                            </label>
                        </div>
                    </div>

                    <!-- Input Fields -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الاسم واللقب *</label>
                        <input type="text" id="customer_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="مثال: محمد السعيد">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">رقم الهاتف * (10 أرقام تبدأ بـ 0)</label>
                        <input type="tel" id="phone_number" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 text-left bg-white" dir="ltr" placeholder="0XXXXXXXXX">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الولاية *</label>
                        <select id="wilayaSelect" required onchange="calculateTotal()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                            <option value="">-- اختر الولاية من القائمة --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">العنوان بالتفصيل</label>
                        <input type="text" id="address" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="البلدية، الحي، رقم الشارع">
                    </div>

                    <!-- Delivery Type Selection -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-2">طريقة التوصيل *</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="delivery-option cursor-pointer">
                                <input type="radio" name="livraison_post" value="domicile" checked onchange="calculateTotal()" class="sr-only">
                                <div class="delivery-box rounded-lg text-center bg-white hover:bg-gray-50 flex flex-col items-center">
                                    <!-- Truck SVG -->
                                    <svg class="w-5 h-5 text-fuchsia-600 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.25V12m0 0h4.5m-4.5 0H3.375m0 0V5.625c0-.621.504-1.125 1.125-1.125h9.75c.621 0 1.125.504 1.125 1.125v6.375z" /></svg>
                                    <span class="block text-[0.7rem] font-bold text-gray-700">توصيل للمنزل</span>
                                    <span class="text-[0.65rem] text-gray-500" id="domicilePrice">-</span>
                                </div>
                            </label>
                            
                            <label class="delivery-option cursor-pointer">
                                <input type="radio" name="livraison_post" value="bureau" onchange="calculateTotal()" class="sr-only">
                                <div class="delivery-box rounded-lg text-center bg-white hover:bg-gray-50 flex flex-col items-center">
                                    <!-- Post/Envelope SVG -->
                                    <svg class="w-5 h-5 text-fuchsia-600 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>
                                    <span class="block text-[0.7rem] font-bold text-gray-700">توصيل للبريد</span>
                                    <span class="text-[0.65rem] text-gray-500" id="postPrice">-</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Price Summary Card -->
                    <div class="bg-gray-50 rounded-xl p-4 space-y-2 border border-gray-200">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">سعر المنتج:</span>
                            <span class="font-bold text-gray-800" id="displayProductPrice">1600 د.ج</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">سعر التوصيل:</span>
                            <span class="font-bold text-gray-800" id="displayDeliveryPrice">-</span>
                        </div>
                        <div class="border-t border-gray-200 pt-2 mt-1">
                            <div class="flex justify-between text-base">
                                <span class="font-bold text-gray-700">المجموع الكلي:</span>
                                <span class="font-black text-violet-700 text-xl" id="displayTotalPrice">1600 د.ج</span>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Footer -->
                <div class="flex flex-col gap-3">
                    <button onclick="submitOrder()" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-violet-700 hover:from-purple-700 hover:to-violet-800 text-white font-bold py-3 px-5 rounded-xl shadow active:scale-[0.99] transition-all text-center flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <!-- Shopping Basket SVG -->
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                        تأكيد الطلب - الدفع عند الاستلام
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukmpamuyakbeewbbkhxc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-mFgnkFPzb2iBNqZXmAHcA_Qpvp1S38';
        
        let supabaseClient = null;

        let selectedProductPrice = 1600;
        let selectedQuantity = 1;
        let loadedWilayas = [];
        let currentDeliveryPrice = 0;
        let currentWilayaData = null;
        let wilayaSelected = false;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            fetchWilayasFromSupabase();
        });

        async function fetchWilayasFromSupabase() {
            const selectElement = document.getElementById('wilayaSelect');
            if (!supabaseClient || SUPABASE_URL === "YOUR_SUPABASE_URL") {
                selectElement.innerHTML = `<option value="">-- خطأ: لم يتم ربط مفاتيح سوبابيس --</option>`;
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('wilayas_store')
                    .select('id, number, name, delivery_domicile, delivery_post')
                    .order('number', { ascending: true });

                if (error) throw error;
                loadedWilayas = data;
                
                selectElement.innerHTML = `<option value="">-- اختر الولاية من القائمة --</option>`;
                loadedWilayas.forEach(wilaya => {
                    const option = document.createElement('option');
                    option.value = wilaya.id;
                    option.textContent = `${wilaya.number} - ${wilaya.name}`;
                    selectElement.appendChild(option);
                });
            } catch (err) {
                selectElement.innerHTML = `<option value="">-- فشل جلب الولايات --</option>`;
            }
            calculateTotal();
        }

        function switchOffer(price, qty) {
            selectedProductPrice = price;
            selectedQuantity = qty;
            
            const offer1 = document.getElementById('containerOffer1');
            const offer2 = document.getElementById('containerOffer2');
            
            offer1.classList.remove('selected');
            offer2.classList.remove('selected');
            
            if (qty === 1) {
                offer1.classList.add('selected');
            } else if (qty === 2) {
                offer2.classList.add('selected');
            }
            
            calculateTotal();
        }

        function calculateTotal() {
            const selectedWilayaId = document.getElementById('wilayaSelect').value;
            const deliveryType = document.querySelector('input[name="livraison_post"]:checked')?.value || 'domicile';
            
            wilayaSelected = selectedWilayaId && selectedWilayaId !== '';
            
            if (wilayaSelected && loadedWilayas.length > 0) {
                currentWilayaData = loadedWilayas.find(w => w.id == selectedWilayaId);
            } else {
                currentWilayaData = null;
            }
            
            let deliveryPrice = 0;
            let deliveryDisplay = '-';
            
            if (currentWilayaData) {
                deliveryPrice = deliveryType === 'domicile' 
                    ? currentWilayaData.delivery_domicile 
                    : currentWilayaData.delivery_post;
                deliveryDisplay = `${deliveryPrice} د.ج`;
            }
            currentDeliveryPrice = deliveryPrice;
            
            const total = wilayaSelected ? selectedProductPrice + deliveryPrice : selectedProductPrice;
            
            document.getElementById('displayProductPrice').textContent = `${selectedProductPrice} د.ج`;
            document.getElementById('displayDeliveryPrice').textContent = deliveryDisplay;
            document.getElementById('displayTotalPrice').textContent = wilayaSelected ? `${total} د.ج` : `${selectedProductPrice} د.ج`;
            
            if (currentWilayaData) {
                document.getElementById('domicilePrice').textContent = `${currentWilayaData.delivery_domicile} د.ج`;
                document.getElementById('postPrice').textContent = `${currentWilayaData.delivery_post} د.ج`;
            } else {
                document.getElementById('domicilePrice').textContent = '-';
                document.getElementById('postPrice').textContent = '-';
            }
        }

        async function submitOrder() {
            const customerName = document.getElementById('customer_name').value.trim();
            const phoneNumber = document.getElementById('phone_number').value.trim();
            const wilayaId = document.getElementById('wilayaSelect').value;
            const detailedAddress = document.getElementById('address').value.trim();
            const deliveryType = document.querySelector('input[name="livraison_post"]:checked')?.value || 'domicile';
            
            const selectedColor = document.querySelector('input[name="product_color"]:checked').value;
            
            if (!customerName || !phoneNumber || !wilayaId) {
                alert('من فضلك، املأ جميع الحقول الأساسية المطلوبة والمؤشر عليها بنجمة (*)');
                return;
            }

            if (!detailedAddress) {
                alert('من فضلك، أدخل العنوان بالتفصيل');
                return;
            }

            const strictPhoneCheck = /^0\d{9}$/;
            if (!strictPhoneCheck.test(phoneNumber)) {
                alert('خطأ في رقم الهاتف! يجب أن يتكون من 10 أرقام تماماً ويبدأ بـ 0');
                return;
            }

            const totalPrice = selectedProductPrice + currentDeliveryPrice;
            const submitBtn = document.getElementById('submitBtn');
            
            const originalBtnContent = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            // Replaced FontAwesome spinner with SVG spinner
            submitBtn.innerHTML = `
                <svg class="w-5 h-5 animate-spin" xmlns="http://www.w3.org/1600/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                جاري إرسال طلبك...
            `;

            const finalOrderPayload = {
                customer_name: customerName,
                phone_number: phoneNumber,
                address: detailedAddress,
                quantity: parseInt(selectedQuantity),
                total_price: parseFloat(totalPrice),
                wilaya_id: parseInt(wilayaId),
                color: selectedColor,
                livraison_post: deliveryType,
                status: 'pending'
            };

            if (!supabaseClient || SUPABASE_URL === "YOUR_SUPABASE_URL") {
                alert("تم الفحص! يرجى وضع مفاتيح سوبابيس الحقيقية في الأسطر الأولى للـ Script لترحيل الطلب.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([finalOrderPayload]);

                if (error) throw error;

                alert('تم تسجيل طلبك ولونك المفضّل بنجاح! سنتصل بك قريباً للتأكيد.');
                document.getElementById('orderForm').reset();
                document.querySelector('input[name="livraison_post"][value="domicile"]').checked = true;
                document.getElementById('wilayaSelect').value = '';
                calculateTotal();
            } catch (err) {
                alert(`حدث خطأ أثناء إرسال الطلب: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
            }
        }
    </script>
</body>
</html>
